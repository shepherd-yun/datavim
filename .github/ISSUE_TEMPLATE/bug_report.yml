name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keys pressed, the SQL run, the table's shape. Leave out passwords and private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: datavim --version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, terminal, database and version
      placeholder: macOS 26, Ghostty 1.2, PostgreSQL 16
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: From ~/.local/state/datavim/datavim.log (run with --debug for more).
      render: text
