version: 2
project_name: sqlvim

builds:
  - id: sqlvim
    main: ./cmd/sqlvim
    binary: sqlvim
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - CHANGELOG.md
      - docs/examples/*

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md: the release workflow passes
# --release-notes, which replaces the generated changelog. Do not set
# changelog.disable: it skips --release-notes too.

release:
  github:
    owner: shepherd-yun
    name: sqlvim

homebrew_casks:
  - name: sqlvim
    repository:
      owner: shepherd-yun
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/shepherd-yun/sqlvim
    description: Terminal SQL client for MySQL and PostgreSQL with vim keys
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sqlvim"]
          end
