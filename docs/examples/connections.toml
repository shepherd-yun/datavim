# Copy to ~/.config/sqlvim/connections.toml
# Passwords are NOT stored here: sqlvim asks on first connect and can save
# them to the macOS Keychain (service "sqlvim", account = connection name).
# SQLVIM_PASSWORD_<NAME> (e.g. SQLVIM_PASSWORD_LOCAL_MYSQL) overrides the keychain.

[[connection]]
name     = "local-mysql"
driver   = "mysql"
host     = "127.0.0.1"
port     = 3306
user     = "root"
database = "app"

[[connection]]
name     = "local-pg"
driver   = "postgres"
host     = "127.0.0.1"
port     = 5432
user     = "postgres"
database = "app"
params   = { sslmode = "disable" }

[[connection]]
name     = "prod-pg"
driver   = "postgres"
host     = "10.0.1.5"
user     = "readonly"
database = "app"
env      = "prod"          # marked [PROD]; read-only by default

[[connection]]
name     = "staging-mysql"
driver   = "mysql"
host     = "10.0.2.7"      # resolved by the SSH server
user     = "app"
database = "app"
env      = "staging"
ssh      = "bastion"       # a Host alias from ~/.ssh/config (ProxyJump works too)

[[connection]]
name     = "crm"
driver   = "sqlserver"
host     = "10.0.3.9"
port     = 1433
user     = "reader"
database = "crm"
env      = "prod"          # SQL Server: read-only is enforced by sqlvim only
params   = { encrypt = "disable" }   # older servers; or TrustServerCertificate = "true", tlsmin = "1.0"

[[connection]]
name     = "ora"
driver   = "oracle"
host     = "10.0.4.2"
user     = "hr"
database = "ORCLPDB1"      # the service name; FREEPDB1 when empty

[[connection]]
name     = "cache"
driver   = "redis"
host     = "127.0.0.1"
port     = 6379
database = "0"             # the default db number
env      = "prod"
params   = { separator = ":" }   # groups keys into folders; tls = "true" for TLS

[[connection]]
name     = "events"
driver   = "kafka"
host     = "b1.internal:9092,b2.internal:9092"   # bootstrap brokers; port defaults to 9092
user     = "reader"        # the SASL user; the password goes to the keychain
env      = "prod"
params   = { sasl = "scram-sha-512", tls = "true" }   # also tls_ca, tls_cert, tls_key, client_id, show_internal
