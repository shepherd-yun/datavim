# Copy to ~/.config/sqlvim/config.toml. Every key is optional.
page_size        = 200            # rows per page in table data tabs
max_column_width = 40             # widest a grid column gets
max_rows         = 1000           # rows a console query fetches (] loads more)
compare_max_rows = 100000         # rows a data compare (D in a diff tab) reads per side
editor           = "nvim"         # <space>v; default: $VISUAL, then $EDITOR, then nvim
export_dir       = "~/Downloads"  # default directory for <space>x exports
icons            = "nerd"         # tree icons: "nerd" needs a Nerd Font (v3); "plain" works in any font

# Colors: ANSI indexes "0"–"255" (follow your terminal's palette) or "#rrggbb".
# Slots: border focus error accent on_error visual_bg visual_fg changed
#        inserted view builtin string number operator
[theme]
# focus  = "#7aa2f7"
# accent = "14"
