version: "2"
linters:
  enable:
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    exhaustive:
      # Only switches marked //exhaustive:enforce are checked: every switch
      # on sqlx.Dialect carries the mark, so a new engine cannot fall
      # through to another engine's behaviour.
      explicit-exhaustive: true
  exclusions:
    rules:
      # Everything lives under internal/ (spec §11); doc comments on every
      # exported identifier would be noise.
      - linters: [revive]
        text: "^exported: "
formatters:
  enable:
    - gofumpt
    - goimports
