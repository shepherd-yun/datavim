version: "2"
linters:
  enable:
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      # Everything lives under internal/ (spec §11); doc comments on every
      # exported identifier would be noise.
      - linters: [revive]
        text: "^exported: "
formatters:
  enable:
    - gofumpt
    - goimports
